spring.application.name=chat-app
spring.profiles.default=dev

# Actuator: expose the health endpoint only. Every other endpoint stays off the
# web surface until a task needs it (env, beans, and heapdump leak configuration
# and internals). Health is public so container and Kubernetes probes can reach
# it before any authentication exists; show-details=never keeps that public
# response to UP/DOWN and nothing more. Revisit to when-authorized once a role
# model exists.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
